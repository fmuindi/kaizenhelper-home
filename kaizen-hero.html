const { useState, useEffect, useRef, useContext, createContext } = React;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const Easing = {
  linear: t => t,
  easeInOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  easeInOutCubic: t => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
};
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        return output[i] + (output[i + 1] - output[i]) * ease(local);
      }
    }
    return output[output.length - 1];
  };
}
const TimelineContext = createContext(0);
const useTime = () => useContext(TimelineContext);

const CW = 1672, CH = 941, DURATION = 17;

function Stage({ children }) {
  const [time, setTime] = useState(0);
  const [scale, setScale] = useState(1);
  const ref = useRef(null), raf = useRef(null), last = useRef(null);
  useEffect(() => {
    const measure = () => { const el = ref.current; if (!el) return; setScale(Math.min(el.clientWidth / CW, el.clientHeight / CH)); };
    measure();
    const ro = new ResizeObserver(measure); if (ref.current) ro.observe(ref.current);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);
  useEffect(() => {
    const step = (ts) => { if (last.current == null) last.current = ts; const dt = (ts - last.current) / 1000; last.current = ts; setTime(t => (t + dt) % DURATION); raf.current = requestAnimationFrame(step); };
    raf.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf.current);
  }, []);
  return (
    <div ref={ref} style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', background: '#0b1020' }}>
      <div style={{ width: CW, height: CH, transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0, position: 'relative', overflow: 'hidden' }}>
        <TimelineContext.Provider value={time}>{children}</TimelineContext.Provider>
      </div>
    </div>
  );
}

const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const win = (t, a, b, fIn = 0.8, fOut = 0.8) => clamp(Math.min(seg(t, a, a + fIn), 1 - seg(t, b - fOut, b)), 0, 1);

function Screen({ src, vis }) {
  if (vis <= 0.001) return null;
  const blur = vis < 0.985 ? (1 - vis) * 3.2 : 0;
  return <img src={src} alt="" style={{ position: 'absolute', left: 0, top: 0, width: CW, height: CH, opacity: vis, filter: blur ? `blur(${blur}px)` : 'none', objectFit: 'cover', display: 'block' }} />;
}

function Ring({ x, y, r = 50, color = C.cta, vis, t, period = 1.3 }) {
  if (vis <= 0.001) return null;
  const rings = [0, 1].map(i => { const p = ((t / period) + i * 0.5) % 1; return { scale: 0.55 + p * 0.95, op: (1 - p) * 0.8 }; });
  return (
    <div style={{ position: 'absolute', left: x, top: y, zIndex: 40, opacity: vis }}>
      {rings.map((rg, i) => <div key={i} style={{ position: 'absolute', left: -r, top: -r, width: r * 2, height: r * 2, borderRadius: '50%', border: `3px solid ${color}`, transform: `scale(${rg.scale})`, opacity: rg.op }} />)}
      <div style={{ position: 'absolute', left: -r * 0.62, top: -r * 0.62, width: r * 1.24, height: r * 1.24, borderRadius: '50%', border: `2.5px solid ${color}`, boxShadow: `0 0 0 4px ${color}22` }} />
    </div>
  );
}

function Cursor({ x, y, press, vis }) {
  if (vis <= 0.001) return null;
  const s = (1 - press * 0.14) * 1.35;
  return (
    <div style={{ position: 'absolute', left: x, top: y, transform: `translate(-4px,-3px) scale(${s})`, transformOrigin: '4px 3px', zIndex: 60, opacity: vis, filter: 'drop-shadow(0 4px 7px rgba(17,22,63,.4))' }}>
      {press > 0 && <div style={{ position: 'absolute', left: 3, top: 3, width: 46, height: 46, marginLeft: -23, marginTop: -23, borderRadius: '50%', border: `2.5px solid ${C.cta}`, opacity: press * 0.7, transform: `scale(${0.4 + press})` }} />}
      <svg width="30" height="30" viewBox="0 0 26 26" fill="none"><path d="M3 2l0 19 5.2-4.9 3 6.9 3.3-1.4-2.9-6.7 7.1 0L3 2z" fill="#fff" stroke={C.ink} strokeWidth="1.5" strokeLinejoin="round" /></svg>
    </div>
  );
}

function Scene() {
  const t = useTime();
  const ES = Easing.easeInOutSine, EC = Easing.easeInOutCubic;

  const vList = win(t, 0, 4.2, 0.01, 0.85);
  const vModal = win(t, 3.6, 7.5, 0.85, 0.85);
  const vBoard = win(t, 6.9, 12.2, 0.85, 0.85);
  const vMeet = win(t, 11.5, 14.8, 0.85, 0.85);
  const vClose = win(t, 14.4, 17.0, 0.85, 0.01);

  const ct = [0, 3.0, 4.2, 7.0, 7.6, 9.0, 12.0, 12.6, 14.6, 17.0];
  const cs = [1.06, 1.10, 1.12, 1.13, 1.04, 1.05, 1.15, 1.06, 1.10, 1.11];
  const cx = [836, 1080, 836, 836, 836, 900, 1140, 760, 600, 760];
  const cy = [470, 360, 470, 470, 470, 460, 300, 470, 380, 460];
  const s = interpolate(ct, cs, ES)(t);
  const fx = interpolate(ct, cx, ES)(t);
  const fy = interpolate(ct, cy, ES)(t);
  const tx = 836 - fx * s, ty = 470 - fy * s;

  const cuT = [0, 1.8, 2.7, 3.5, 4.6, 6.0, 6.9, 8.5, 11.0, 12.6, 13.8, 14.6, 17.0];
  const cuX = [1500, 1050, 1590, 1590, 980, 1095, 1095, 1250, 1150, 320, 165, 165, 165];
  const cuY = [920, 540, 60, 60, 470, 641, 641, 300, 220, 250, 316, 316, 316];
  const curX = interpolate(cuT, cuX, EC)(t);
  const curY = interpolate(cuT, cuY, EC)(t);
  const curVis = clamp(seg(t, 0.3, 1.0) - seg(t, 14.7, 15.2), 0, 1);

  const clicks = [3.2, 6.6, 14.2];
  let press = 0;
  for (const c of clicks) { const d = Math.abs(t - c); if (d < 0.24) press = Math.max(press, 1 - d / 0.24); }

  const caps = [
    { a: 0.6, b: 3.4, n: '1', txt: 'Track every condition in one place' },
    { a: 4.0, b: 6.8, n: '2', txt: 'Report by voice — AI fills in the details' },
    { a: 7.4, b: 11.6, n: '3', txt: 'Your operation, live in real time' },
    { a: 12.2, b: 14.4, n: '4', txt: 'Run the meetings that close the loop' },
  ];
  let cap = null, capOp = 0;
  for (const c of caps) { const o = win(t, c.a, c.b, 0.45, 0.45); if (o > capOp) { capOp = o; cap = c; } }

  const lock = win(t, 14.9, 17.0, 0.65, 0.01);
  const fade = clamp(seg(t, 0, 0.6), 0, 1) * (1 - clamp(seg(t, 16.5, 17.0), 0, 1));

  return (
    <div style={{ position: 'absolute', inset: 0, opacity: fade, background: '#0b1020' }}>
      <div style={{ position: 'absolute', width: CW, height: CH, transformOrigin: '0 0', transform: `translate(${tx}px, ${ty}px) scale(${s})`, willChange: 'transform' }}>
        <Screen src={IMG.list} vis={vList} />
        <Screen src={IMG.modal} vis={vModal} />
        <Screen src={IMG.board} vis={vBoard} />
        <Screen src={IMG.meet} vis={vMeet} />
        <Screen src={IMG.board} vis={vClose} />
        <div style={{ position: 'absolute', left: 0, top: 0, width: CW, height: CH, background: 'rgba(11,16,32,.74)', opacity: lock, zIndex: 30 }} />
        <Ring x={1592} y={55} r={46} color={C.appBlue} vis={win(t, 2.4, 3.4, 0.3, 0.2)} t={t} />
        <Ring x={895} y={490} r={50} color={C.appBlue} vis={win(t, 4.4, 6.3, 0.4, 0.3)} t={t} />
        <Ring x={1472} y={37} r={52} color={C.cta} vis={win(t, 8.0, 9.8, 0.4, 0.3)} t={t} />
        <Ring x={1045} y={210} r={60} color={C.cta} vis={win(t, 10.0, 11.8, 0.4, 0.4)} t={t} />
        <Cursor x={curX} y={curY} press={press} vis={curVis} />
      </div>

      {cap && (
        <div style={{ position: 'absolute', left: 836, bottom: 56, transform: `translate(-50%, ${(1 - capOp) * 12}px)`, opacity: capOp, zIndex: 70, display: 'flex', alignItems: 'center', gap: 14, background: 'rgba(17,22,63,.95)', color: '#fff', padding: '15px 26px 15px 17px', borderRadius: 999, boxShadow: '0 16px 42px rgba(11,16,32,.45)', fontFamily: FB }}>
          <span style={{ width: 34, height: 34, borderRadius: '50%', background: `linear-gradient(135deg, ${C.brand}, ${C.cta})`, display: 'grid', placeItems: 'center', fontFamily: FH, fontWeight: 700, fontSize: 17, flexShrink: 0 }}>{cap.n}</span>
          <span style={{ fontSize: 21, fontWeight: 600, letterSpacing: '-0.01em', whiteSpace: 'nowrap' }}>{cap.txt}</span>
        </div>
      )}

      {lock > 0.001 && (
        <div style={{ position: 'absolute', inset: 0, zIndex: 80, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', opacity: lock, transform: `scale(${0.97 + lock * 0.03})`, fontFamily: FB }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
            <div style={{ width: 64, height: 64, borderRadius: 18, background: `linear-gradient(135deg, ${C.brand}, ${C.accent})`, display: 'grid', placeItems: 'center', boxShadow: '0 14px 34px rgba(61,65,193,.5)' }}>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M4 18l5-6 4 4 7-9" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" /><path d="M16 7h4v4" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
            </div>
            <span style={{ fontFamily: FH, fontWeight: 700, fontSize: 46, color: '#fff', letterSpacing: '-0.02em' }}>Kaizen Helper</span>
          </div>
          <div style={{ marginTop: 22, fontSize: 26, color: 'rgba(255,255,255,.82)', fontWeight: 500, textAlign: 'center', maxWidth: 820, lineHeight: 1.35 }}>
            Turn daily problems into <span style={{ color: C.brandSoft, fontWeight: 600 }}>continuous improvement</span>
          </div>
        </div>
      )}
    </div>
  );
}

function KaizenHero() { return <Stage><Scene /></Stage>; }
ReactDOM.createRoot(document.getElementById('root')).render(<KaizenHero />);
</script>
</body>
</html>
